    next_hover: "<gray>Open the next PRIUS page."

  note:
    saved: "<yellow>>> Staff note saved to <white>%1<yellow>'s PRIUS record."

  warn:
    default_reason: "A staff member has warned you about your current behavior."
    sent_online: "<yellow>>> <white>%1 <yellow>has been warned and the warning was recorded in PRIUS."
    saved_offline: "<yellow>>> The warning for <white>%1 <yellow>was recorded and will be delivered when they next join."
    received: "<red>>> You have been warned. <gray>Reason: <white>%1"

  kick:
    disconnect: "<red>You were disconnected by staff.\n<gray>Reason: <white>%1"
    completed: "<yellow>>> Disconnected <white>%1 <yellow>and recorded the action in PRIUS."

  inventory:
    opened: "<yellow>>> Opened <white>%1<yellow>'s editable <white>%2<yellow>."
    group_denied: "<red>You may open <white>%1<red>'s inventory only when their assigned group is the same as yours or lower."

  hide:
    hidden: "<yellow>>> You are hidden from players and now observing in spectator mode."
    visible: "<yellow>>> You are visible again and your previous game mode has been restored."

  chat_cleared: "<yellow>>> Chat was cleared by <white>%1<yellow>."

  clear:
    completed: "<yellow>>> Cleared <white>%1<yellow>'s inventory."
    received: "<red>Your inventory was cleared by staff."

  mute:
    chat_blocked: "<red>You are muted and cannot speak in public chat."

  buildoff:
    interaction_blocked: "<dark_purple>You are Marked and cannot modify or interact with the world."

  tempban:
    login_indefinite: "<red>You are temporarily banned.\n<gray>No expiry is available.\n<gray>Reason: <white>%1"
    login_timed: "<red>You are temporarily banned.\n<gray>Expires: <white>%1 <gray>(<white>%2 <gray>remaining)\n<gray>Reason: <white>%3"

  staff_emergency:
    alert: "<red><bold>STAFF EMERGENCY:</bold> <white>%1 <red>changed <white>%2<red>'s <white>%3 <red>with <white>%4 %5<red>. Reason: <white>%6"

  punishment:
    usage: "<yellow>>> Inspect: <white>/%1 <player><yellow>. Change: <white>/%1 <player> <time> <reason...><yellow>, <white>/%1 <player> <set|add|sub> <time> <reason...><yellow>, or <white>/%1 <player> off <reason...><yellow>."
    invalid_duration: "<red><white>%1 <red>is not valid here. Punishments accept <white>m/minute, h/hour, d/day, w/week <red>without spaces, for example <white>1h30m <red>or <white>1hour30minutes<red>. Seconds are not accepted."
    unknown_action: "<red>Unknown punishment operation: <white>%1<red>."
    infinite_not_allowed: "<red><white>%1 <red>cannot use that indefinite operation."
    indefinite_change_rejected: "<red><white>%1<red>'s <white>%2 <red>is indefinite. Use <white>set <red>or <white>off <red>instead."
    too_long: "<red>A continuous punishment sentence cannot exceed <white>%1 days<red>. Shorten the requested time or use a permanent ban where policy calls for one."
    reduction_denied: "<red>Moderators may begin or extend punishments. A Senior Moderator or higher must shorten, replace, or remove an active sentence."
    reason_unavailable: "No reason is available for this active state."
    less_than_minute: "less than one minute"
    inactive: "<yellow>>> <white>%1 <yellow>does not have an active <white>%2<yellow>."
