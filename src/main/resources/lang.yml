command:
  unknown: "<red>Unknown command: <white>%1"
  no_permission: "<red>You do not have permission to use this command."
  no_sub_permission: "<red>You do not have permission to use this subcommand."
  module_disabled: "<red>The module containing the <white>%1 <red>command is disabled."
  disabled: "<red>The <white>%1 <red>command is disabled."
  insufficient_funds: "<red>You need <white>%1 %2 <red>to use this command."
  cooldown: "<red>This command is on cooldown for another <white>%1 seconds<red>."
  unavailable: "<red>This command is currently unavailable."

  syntax:
    usage: "<red>Usage: <white>%1"

  error:
    prefix: "<red>Error: <white>%1"
    general: "<red>An unexpected error occurred while executing this command."

economy:
  balance: "<yellow>>> Your current bank balance is <white>%1<yellow>, safely stored until you need it."
  wallet: "<yellow>>> You currently have <white>%1 <yellow>available to spend from your wallet."

timers:
  usage: "<yellow>>> Timer administration: <white>/ticker get <player> <timer><yellow>, <white>/ticker set <player> <timer> <time|infinite><yellow>, <white>/ticker add <player> <timer> <time><yellow>, <white>/ticker sub <player> <timer> <time><yellow>, or <white>/ticker reset <player> <timer><yellow>. Time units: <white>s, m, h, d, w<yellow>."
  unknown_action: "<red>Unknown timer action: <white>%1<red>."
  player_not_found: "<red>No registered player was found with the username <white>%1<red>."
  invalid_key: "<red><white>%1 <red>is not a valid timer key. Use 1-64 lowercase letters, numbers, dots, underscores or hyphens, beginning with a letter."
  invalid_duration: "<red><white>%1 <red>is not a valid duration. Combine <white>s, m, h, d, w <red>without spaces, for example <white>1h30m<red>."
  inactive: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer is not active."
  active_indefinite: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer is active indefinitely."
  active_finite: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer expires at <white>%3 <yellow>(<white>%4 <yellow>remaining)."
  set_indefinite: "<yellow>>> Set <white>%1<yellow>'s <white>%2 <yellow>timer to indefinite."
  set_finite: "<yellow>>> Set <white>%1<yellow>'s <white>%2 <yellow>timer for <white>%4<yellow>; it expires at <white>%3<yellow>."
  added: "<yellow>>> Added <white>%1 <yellow>to <white>%2<yellow>'s <white>%3 <yellow>timer. New expiry: <white>%4<yellow>."
  subtracted: "<yellow>>> Removed <white>%1 <yellow>from <white>%2<yellow>'s <white>%3 <yellow>timer. New expiry: <white>%4<yellow>."
  ended_by_subtraction: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer reached zero and was removed."
  reset: "<yellow>>> Reset <white>%1<yellow>'s <white>%2 <yellow>timer."
  indefinite_change_rejected: "<red><white>%1<red>'s <white>%2 <red>timer is indefinite. Set or reset it instead."
  database_error: "<red>The timer change could not be saved. Nothing was changed; check the console."

locations:
  spawn:
    unavailable: "<dark_purple>The road to spawn has gone quiet. Its anchor may be missing."
    teleport_failed: "<red>The path opened, then cast you back where you stood."
    teleported: "<light_purple>The world folds around you, returning you to spawn."
    saved: "<green>Server spawn updated."
    save_failed: "<red>Server spawn could not be updated. Check the console."
  last:
    restored: "<gray>The world remembers where you left it."

menus:
  main:
    title: "<dark_purple><bold>GoldenLeaf <gray>| <light_purple>Main Menu"
    unavailable: "<yellow>>> The path to %1 <yellow>is not open yet. Its doors will appear when that system is ready."
    warps:
      name: "<light_purple><bold>Warps & Waystones"
      lore:
        - "<gray>Cross the world without wearing your boots to dust."
        - "<gray>Visit server landmarks and player-built destinations."
        - "<dark_gray>Command: <white>/warp"
        - "<yellow>Click to browse the roads."
    tutorials:
      name: "<gold><bold>Guides & Tutorials"
      lore:
        - "<gray>The world is large; nobody expects you to memorize it."
        - "<gray>Read guides, mechanics and the laws of the land."
        - "<dark_gray>Commands: <white>/tutorials <dark_gray>or <white>/help"
        - "<yellow>Click to open the library."
    shop:
      name: "<green><bold>Server Shop"
      lore:
        - "<gray>Browse useful goods, rare stock and honest commerce."
        - "<gray>Your coin purse may object to the experience."
        - "<dark_gray>Command: <white>/shop"
        - "<yellow>Click to visit the counter."
    auctions:
      name: "<aqua><bold>Player Auctions"
      lore:
        - "<gray>Browse treasures offered by other travelers."
        - "<gray>One person's clutter is another person's suspicious bargain."
        - "<dark_gray>Commands: <white>/auction <dark_gray>or <white>/ah"
        - "<yellow>Click to inspect the market."
    settings:
      name: "<yellow><bold>Your Settings"
      lore:
        - "<gray>Choose how chat, requests and server systems treat you."
        - "<gray>These choices follow your account between visits."
        - "<dark_gray>Command: <white>/settings"
        - "<yellow>Click to adjust your experience."
    achievements:
      name: "<aqua><bold>Achievements"
      lore:
        - "<gray>See the deeds, disasters and milestones remembered here."
        - "<gray>Some are glorious. Some merely prove you survived."
        - "<dark_gray>Commands: <white>/achievements <dark_gray>or <white>/ac"
        - "<yellow>Click to open your chronicle."
    friends:
      name: "<green><bold>Friends & Trust"
      lore:
        - "<gray>Manage companions, requests and trusted builders."
        - "<gray>Choose carefully; friends can reach the diamond chest."
        - "<dark_gray>Command: <white>/friend"
        - "<yellow>Click to view your circle."
    tickets:
      name: "<red><bold>Ask for Help"
      lore:
        - "<gray>Something broken, confusing or actively on fire?"
        - "<gray>Put it in writing so the staff can investigate."
        - "<dark_gray>Command: <white>/ticket"
        - "<yellow>Click to open a ticket."
    voting:
      name: "<light_purple><bold>Support GoldenLeaf"
      lore:
        - "<gray>Help new travelers find the server."
        - "<gray>The realm notices your support and rewards it."
        - "<dark_gray>Command: <white>/vote"
        - "<yellow>Click to view the voting sites."

empty:
  greeting: "<yellow>>> The example module is awake."
  greeting_named: "<yellow>>> Hello, <white>%1<yellow>. The example module is awake."

players:
  data_update_failed: "<red>That change could not be saved. Nothing was changed; please try again."
  player_not_found: "<red>No player named <white>%1 <red>has ever passed through this server."
  menu_coming_soon: "<yellow>>> The <white>%1 <yellow>menu is still being built. The command form already works."

  trust:
    cannot_trust_self: "<red>You cannot trust even yourself!"
    cannot_untrust_self: "<red>You cannot remove yourself from your own trust. That would be an impressive paradox."
    added: "<yellow>>> You now trust <white>%1<yellow> with your protected spaces."
    added_target: "<yellow>>> <white>%1 <yellow>has trusted you with their protected spaces."
    already_trusted: "<yellow>>> <white>%1 <yellow>is already on your trust list."
    friend_already_trusted: "<yellow>>> <white>%1 <yellow>is your friend, so they already receive trusted access."
    removed: "<yellow>>> <white>%1 <yellow>has been removed from your trust list."
    removed_target: "<yellow>>> <white>%1 <yellow>has removed your explicit trusted access."
    not_trusted: "<yellow>>> <white>%1 <yellow>is not on your trust list."
    friend_access_remains: "<yellow>>> <white>%1 <yellow>is not explicitly trusted; your friendship still grants them access."

  friend:
    cannot_befriend_self: "<red>You cannot befriend yourself. Even the server knows you are already acquainted."
    cannot_unfriend_self: "<red>You cannot unfriend yourself. This is not that kind of journey."
    pending_notice: "<yellow>>> You have <white>%1 <yellow>pending friend request(s). View them with <white>/list friends<yellow>."
    request_sent: "<yellow>>> Your friend request is on its way to <white>%1<yellow>."
    request_received: "<yellow>>> <white>%1 <yellow>would like to be your friend. Use <white>/friend %1 <yellow>to accept."
    already_requested: "<yellow>>> Your friend request to <white>%1 <yellow>is still waiting for an answer."
    already_friends: "<yellow>>> You and <white>%1 <yellow>are already friends."
    accepted: "<yellow>>> You accepted <white>%1<yellow>'s friend request. You now trust one another."
    accepted_target: "<yellow>>> <white>%1 <yellow>accepted your friend request. You now trust one another."
    no_relationship: "<yellow>>> There is no friendship or pending request between you and <white>%1<yellow>."
    removed: "<yellow>>> You and <white>%1 <yellow>are no longer friends."
    removed_target: "<yellow>>> <white>%1 <yellow>has removed you from their friends."
    request_cancelled: "<yellow>>> Your friend request to <white>%1 <yellow>has been cancelled."
    request_cancelled_target: "<yellow>>> <white>%1 <yellow>cancelled their pending friend request."
    request_declined: "<yellow>>> You declined <white>%1<yellow>'s friend request."
    request_declined_target: "<yellow>>> <white>%1 <yellow>declined your friend request."

  list:
    available_basic: "<yellow>>> Available lists: <white>online<yellow> and <white>staff<yellow>. Use <white>/list help <yellow>for details."
    available_player: "<yellow>>> Available lists: <white>trust<yellow>, <white>friends<yellow>, <white>online<yellow> and <white>staff<yellow>. Use <white>/list help <yellow>for details."
    help_basic: "<yellow>>> <white>/list online <yellow>shows everyone online. <white>/list staff <yellow>shows staff currently available."
    help_player: "<yellow>>> <white>/list trust <yellow>shows direct trust, <white>/list friends <yellow>shows friends and requests, <white>/list online <yellow>shows everyone online, and <white>/list staff <yellow>shows available staff."
    unknown: "<red>There is no player list named <white>%1<red>."
    trust_entries: "<yellow>>> Trusted players (<white>%1<yellow>):\n<gray>   %2"
    trust_empty: "<yellow>>> You have not given anyone direct trust yet. Use <white>/trust <player> <yellow>when someone needs access to your protected spaces."
    friend_entries: "<yellow>>> Friends (<white>%1<yellow>):\n<gray>   %2"
    friends_empty: "<yellow>>> You have no friends or pending requests yet. Use <white>/friend <player> <yellow>to send a request."
    incoming_entries: "<yellow>>> Incoming requests (<white>%1<yellow>):\n<gray>   %2"
    outgoing_entries: "<yellow>>> Sent requests (<white>%1<yellow>):\n<gray>   %2"
    online_entries: "<yellow>>> Players online (<white>%1<yellow>):\n<gray>   %2"
    staff_entries: "<yellow>>> Staff online (<white>%1<yellow>):\n<gray>   %2"
    staff_empty: "<yellow>>> No staff members are currently online."

  nick:
    own: "<yellow>>> Around here, people know you as %1<yellow>."
    own_missing: "<yellow>>> You do not have a nickname yet. A moderator can set one for you."
    target: "<yellow>>> <white>%1 <yellow>is known around here as %2<yellow>."
    target_missing: "<yellow>>> <white>%1 <yellow>does not have a nickname."
    invalid: "<red>That nickname is not valid for the %1 group. Use 3-20 letters, numbers, dots or underscores; begin and end with a letter or number; and use no more than three dots/underscores."
    matches_username: "<red>That nickname belongs to the registered Minecraft username <white>%1<red>."
    already_used: "<red>That nickname is already held by <white>%1<red>, regardless of its colors or capitalization."
    updated: "<yellow>>> Nickname updated for <white>%1<yellow>: %2"
    updated_target: "<yellow>>> Your nickname has been set to %1<yellow>."
    already_missing: "<yellow>>> <white>%1 <yellow>does not have a nickname to clear."
    cleared: "<yellow>>> Nickname cleared for <white>%1<yellow>."
    cleared_target: "<yellow>>> <white>%1 <yellow>cleared your nickname. Your Minecraft username will be shown instead."

  welcome:
    no_recent_arrival: "<yellow>>> Nobody has joined since the Players module started."
    target_offline: "<red>%1 is not online to receive a welcome."
    cannot_welcome_yourself: "<red>You cannot welcome yourself. Leave that honor to someone else."
    already_welcomed: "<yellow>>> You have already welcomed <white>%1<yellow>."
    send_failed: "<red>Your welcome could not be sent through chat."
    player_help: "<yellow>>> Use <white>/welcome <yellow>to greet the latest arrival, or <white>/welcome <player> <yellow>for someone online."
    staff_help: "<yellow>>> Player use: <white>/welcome [player]<yellow>. Staff: <white>/welcome show <username><yellow>, <white>/welcome set <username> <message...><yellow>, or <white>/welcome reset <username><yellow>."
    personal_missing: "<yellow>>> <white>%1 <yellow>does not have a personal join welcome."
    personal_display: "<yellow>>> <white>%1<yellow>'s personal join welcome: <white>%2"
    personal_invalid: "<red>A personal welcome must contain 1-70 characters across no more than two non-empty lines."
    personal_updated: "<yellow>>> Personal join welcome updated for <white>%1<yellow>."
    personal_cleared: "<yellow>>> Personal join welcome cleared for <white>%1<yellow>."
    random_messages:
      - "Hello %1! Good to see you!"
      - "Welcome %1!"
      - "Hey %1, welcome!"
      - "Welcome to the server, %1!"
      - "Hi %1! I hope you enjoy your stay."
      - "Glad to have you here, %1!"
      - "Hey %1! Nice to meet you."
      - "Welcome aboard, %1!"
      - "Hello %1! Have fun out there."
      - "Welcome %1! I hope you settle in quickly."
      - "Hi %1, good luck on your adventures!"
      - "Nice to see you, %1. Welcome!"
      - "Hey there, %1! Welcome in."
      - "Welcome %1! I hope your journey starts well."
      - "Hello %1! Enjoy exploring."
      - "Glad you made it, %1!"
      - "Welcome, %1! See you around."
      - "Hi %1! I hope to run into you out there."
      - "Welcome %1! May the roads treat you kindly."
      - "Hello %1! Mind the creepers."
      - "Welcome, %1! Happy building."
      - "Good to have you with us, %1!"
      - "Hey %1! I hope you find a place to call home."
      - "Welcome %1! Have a great time."
