  wallet: "<yellow>>> You currently have <white>%1 <yellow>available to spend from your wallet."

timers:
  usage: "<yellow>>> Timer administration: <white>/ticker get <player> <timer><yellow>, <white>/ticker set <player> <timer> <time|infinite><yellow>, <white>/ticker add <player> <timer> <time><yellow>, <white>/ticker sub <player> <timer> <time><yellow>, or <white>/ticker reset <player> <timer><yellow>. Units: <white>s/sec/second, m/min/minute, h/hr/hour, d/day, w/week<yellow>. Combine them without spaces."
  unknown_action: "<red>Unknown timer action: <white>%1<red>."
  player_not_found: "<red>No registered player was found with the username <white>%1<red>."
  invalid_key: "<red><white>%1 <red>is not a valid timer key. Use 1-64 lowercase letters, numbers, dots, underscores or hyphens, beginning with a letter."
  invalid_duration: "<red><white>%1 <red>is not a valid duration. Use <white>s/sec/second, m/min/minute, h/hr/hour, d/day, w/week<red>, for example <white>1h30m <red>or <white>1hour30minutes<red>."
  inactive: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer is not active."
  active_indefinite: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer is active indefinitely."
  active_finite: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer expires at <white>%3 <yellow>(<white>%4 <yellow>remaining)."
  set_indefinite: "<yellow>>> Set <white>%1<yellow>'s <white>%2 <yellow>timer to indefinite."
  set_finite: "<yellow>>> Set <white>%1<yellow>'s <white>%2 <yellow>timer for <white>%4<yellow>; it expires at <white>%3<yellow>."
  added: "<yellow>>> Added <white>%1 <yellow>to <white>%2<yellow>'s <white>%3 <yellow>timer. New expiry: <white>%4<yellow>."
  subtracted: "<yellow>>> Removed <white>%1 <yellow>from <white>%2<yellow>'s <white>%3 <yellow>timer. New expiry: <white>%4<yellow>."
  ended_by_subtraction: "<yellow>>> <white>%1<yellow>'s <white>%2 <yellow>timer reached zero and was removed."
  reset: "<yellow>>> Reset <white>%1<yellow>'s <white>%2 <yellow>timer."
  indefinite_change_rejected: "<red><white>%1<red>'s <white>%2 <red>timer is indefinite. Set or reset it instead."
  database_error: "<red>The timer change could not be saved. Nothing was changed; check the console."

core:
  ban:
    summary: "Permanently ban a registered player."
    syntax: "/ban <player> [reason...]"
    default_reason: "No reason was provided."
    invalid_reason: "<red>The reason must contain 1-%1 characters on one line."
    player_not_found: "<red>No registered player was found with the username <white>%1<red>."
    cannot_target_self: "<red>You cannot permanently ban yourself."
    cannot_target_group: "<red>You cannot permanently ban <white>%1<red> because their group is not below yours."
    already_banned: "<yellow>>> <white>%1 <yellow>is already permanently banned."
    completed: "<yellow>>> Permanently banned <white>%1<yellow>."
    disconnect: "<red>You are permanently banned from this server.\n<gray>Reason: <white>%1"
    database_error: "<red>The permanent-ban state could not be changed. Check the console."
    prius_failed: "<red>The ban changed, but its PRIUS entry could not be saved. Check the console."
  unban:
    summary: "Remove a permanent player ban."
    syntax: "/unban <player> [reason...]"
    default_reason: "Administrative review."
    not_banned: "<yellow>>> <white>%1 <yellow>is not permanently banned."
    completed: "<yellow>>> Removed the permanent ban from <white>%1<yellow>."

moderation:
  database_error: "<red>The moderation change could not be saved. Check the console."
  player_not_found: "<red>No registered player was found with the username <white>%1<red>."
  player_offline: "<red><white>%1 <red>must be online for that action."
  cannot_target_self: "<red>You cannot use this punishment on yourself."
  cannot_target_group: "<red>You cannot act on <white>%1<red> because their group is not below yours."
  staff_record_private: "<red>Staff PRIUS records and detailed staff sheets are private. Admins may inspect only staff below their assigned group."
  reason_invalid: "<red>The reason must contain 1-%1 characters on one line."

  help:
    header: "<yellow>>> Moderation commands:"
    list_entry: "<gray> • <white>%1 <gray>— %2"
    footer: "<yellow>>> Use <white>/modhelp <command><yellow>, <white>/modhelp topic <topic><yellow>, or <white>/modhelp gui<yellow> for more."
    detail: "<yellow>>> <white>%1\n<gray>%2\n<white>%3"
    unknown: "<red>No moderation command named <white>%1 <red>is registered in this help."
    topic_usage: "<yellow>>> Use <white>/modhelp topic <topic><yellow>. Topics: <white>%1<yellow>."
    menu_title: "<dark_red><bold>Moderation Help"
    menu_name: "<yellow><bold>%1"
    menu_lore: "<gray>%1"
    topic:
      punishments: "<yellow>>> Use <white>m/minute, h/hour, d/day, or w/week<yellow>; seconds are not accepted. One continuous sentence may not exceed <white>365 days<yellow>. Moderators may begin or extend a sentence. Senior Moderators may shorten, end, or replace one. Every change needs a reason, which the player sees without the staff name."
      prius: "<yellow>>> PRIUS is the player's concise staff record: warnings, punishment episodes, kicks, rank information and notes another moderator may need. It is not a server activity log. Every add, set, subtraction and removal remains visible to staff."
      privacy: "<yellow>>> Do not browse player data out of curiosity. Moderators cannot inspect staff PRIUS records or detailed staff sheets. <white>/inv <yellow>may open the inventory of the same assigned group or lower for active staff work. Buildoff and tempban remain emergency tools against staff accounts and are always investigated."
    commands:
      modhelp:
        syntax: "/modhelp [command|topic <topic>|gui]"
        summary: "Show moderation commands and topics."
        detail: "Lists available tools, explains one command, opens a topic, or opens the help menu."
      player:
        syntax: "/player <player>"
        summary: "Open the player's staff sheet."
        detail: "Shows identity, groups, activity, bans, active timers and PRIUS count."
      prius:
        syntax: "/prius <player> [page]"
        summary: "Read the player's PRIUS record."
        detail: "Shows permanent staff notes, warnings and meaningful punishments newest first."
      note:
        syntax: "/note <player> <text...>"
        summary: "Add a staff-only PRIUS note."
        detail: "Notes are permanent and are not shown to the target."
      warn:
        syntax: "/warn <player> [reason...]"
        summary: "Warn a registered player and record it."
        detail: "Online players see it immediately. Offline players receive it once when they next join. The staff source is never shown."
      kick:
        syntax: "/kick <player> <reason...>"
        summary: "Disconnect an online player."
        detail: "The kick and its reason are recorded in PRIUS."
      mute:
        syntax: "/mute <player> [time|set|add|sub|off] [time] [reason...]"
        summary: "Manage a chat mute."
        detail: "A bare time starts or extends a mute. Reasons are mandatory when changing it. Moderators may extend; Senior Moderators may shorten, replace or end it."
      jail:
        syntax: "/jail <player> [time|set|add|sub|off] [time] [reason...]"
        summary: "Manage a player's jail timer."
        detail: "Starts or changes a jail sentence. A reason is mandatory, and the same 365-day and reduction rules apply."
      buildoff:
        syntax: "/buildoff <player> [time|set|add|sub|off] [time] [reason...]"
        summary: "Apply or edit Marked status."
        detail: "Use Marked when a player must remain reachable but cannot build, interact, or use ordinary commands. Their assigned rank stays intact. Indefinite Marked is allowed. It is also the emergency containment action for staff accounts."
      tempban:
        syntax: "/tempban <player> [time|set|add|sub|off] [time] [reason...]"
        summary: "Manage a temporary ban."
        detail: "Removes access until a real-time expiry. Tempbans are always finite and may be used for emergency staff-account containment. Permanent bans use /ban."
      ban:
        syntax: "/ban <player> [reason...]"
        summary: "Permanently ban a registered player."
        detail: "Use this when temporary removal is no longer appropriate. The reason is kept in PRIUS and shown to the player without naming the staff member."
      unban:
        syntax: "/unban <player> [reason...]"
        summary: "Remove a permanent player ban."
        detail: "Restores server access and records the administrative reason in PRIUS."
      inv:
        syntax: "/inv <player> [inventory|ender]"
        summary: "Open an editable online inventory."
        detail: "Changes are live. This command is deliberately not read-only."
      hide:
        syntax: "/hide"
        summary: "Toggle vanish and spectator mode."
        detail: "Running it again restores visibility and the game mode you had before hiding."
      cc:
        syntax: "/cc"
        summary: "Clear visible player chat immediately."
        detail: "Use it when sensitive or harmful text must be hidden without waiting on a cooldown."
      clear:
        syntax: "/clear <player>"
        summary: "Clear an online player's inventory."
        detail: "The target is mandatory, including when clearing your own inventory."

  player:
    online: "online"
    offline: "offline"
    affirmative: "yes"
    negative: "no"
    none: "none"
    sheet: "<yellow>>> Staff sheet for <white>%1\n<gray>ID: <white>%2 <dark_gray>| <gray>UUID: <white>%3\n<gray>Assigned group: <white>%4 <dark_gray>| <gray>Effective group: <white>%5\n<gray>Status: <white>%6 <dark_gray>| <gray>First login: <white>%7 <dark_gray>| <gray>Last login: <white>%8\n<gray>Active punishments: <white>%9 <dark_gray>| <gray>Permanent ban: <white>%10 <dark_gray>| <gray>PRIUS entries: <white>%11"

  prius:
    header: "<yellow>>> PRIUS record for <white>%1 <yellow>— page <white>%2<yellow>/<white>%3 <yellow>(<white>%4 <yellow>entries)"
    summary_punishments: "<gray>Warnings: <white>%1 <gray>| Mutes: <white>%2 <gray>| Jails: <white>%3 <gray>| Marked: <white>%4 <gray>| Tempbans: <white>%5 <gray>| Bans: <white>%6"
    summary_other: "<gray>Kicks: <white>%1 <gray>| Staff notes: <white>%2"
    summary_active: "<yellow>Active now: <white>%1"
    summary_none: "nothing"
    entry_punishment: "<red>%1  %2 <gray>• <white>%3"
    entry_warning: "<yellow>%1  %2 <gray>• <white>%3"
    entry_note: "<aqua>%1  %2 <gray>• <white>%3"
    entry_info: "<green>%1  %2 <gray>• <white>%3"
    entry_text: "<gray>  %1"
    empty: "<gray>No PRIUS entries have been recorded for this player."
    invalid_page: "<red>The PRIUS page must be a positive whole number."
    page_missing: "<red>PRIUS page <white>%1 <red>does not exist. The last page is <white>%2<red>."
    save_failed: "<red>The action succeeded, but its PRIUS entry could not be saved. Check the console."
    previous: "<yellow>[← Previous]"
    previous_disabled: "<gray>[← Previous]"
    previous_hover: "<gray>Open the previous PRIUS page."
    page: " <white>Page %1/%2 "
    next: "<yellow>[Next →]"
